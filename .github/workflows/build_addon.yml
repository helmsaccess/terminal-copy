name: build addon

on:
  push:
    tags: ["v*"]
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt-get update  -y
        sudo apt-get install -y gettext
        uv sync --locked

    - name: Code checks
      run: export PREK_SKIP=no-commit-to-branch; uv run prek run --all-files

    - name: Run unit tests
      run: uv run python -m unittest discover -s tests/unit -v

    - name: Verify release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        addon_version="$(uv run python -c 'import buildVars; print(buildVars.getProductVersion())')"
        uv run python -c 'import buildVars; raise SystemExit("Tagged builds require development_build = None" if buildVars.development_build is not None else 0)'
        if [[ "$GITHUB_REF_NAME" != "v$addon_version" ]]; then
          echo "Release tag $GITHUB_REF_NAME does not match add-on version $addon_version" >&2
          exit 1
        fi
        git cat-file -e "refs/tags/${GITHUB_REF_NAME}^{tag}"
        git merge-base --is-ancestor HEAD origin/main

    - name: Build add-on and translation template
      run: uv run scons pot && uv run scons

    - name: Validate packaged add-on
      run: uv run python tests/package/test_built_addon.py

    - name: Identify validated package
      id: archive
      run: |
        archive="$(uv run python -c 'import buildVars; print(buildVars.addon_info["addon_name"] + "-" + buildVars.getArtifactVersion() + ".nvda-addon")')"
        echo "path=$archive" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.archive.outputs.path }}
        archive: false
        if-no-files-found: error
