name: build addon

on:
  push:
    tags: ["v*"]
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Building the add-on template as an add-on does not make sense (and fails).
    # Do not modify this repo name with your own one! (should remain the template)
    if: github.repository != 'nvaccess/addonTemplate'

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt-get update  -y
        sudo apt-get install -y gettext
        uv sync --locked

    - name: Code checks
      run: export PREK_SKIP=no-commit-to-branch; uv run prek run --all-files

    - name: Run unit tests
      run: uv run python -m unittest discover -s tests/unit -v

    - name: Verify release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        addon_version="$(uv run python -c 'import buildVars; print(buildVars.addon_info["addon_version"])')"
        if [[ "$GITHUB_REF_NAME" != "v$addon_version" ]]; then
          echo "Release tag $GITHUB_REF_NAME does not match add-on version $addon_version" >&2
          exit 1
        fi

    - name: Build add-on and translation template
      run: uv run scons pot && uv run scons

    - name: Validate packaged add-on
      run: uv run python tests/package/test_built_addon.py

    - uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
        archive: false

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: .
        merge-multiple: true
    - name: Display structure of downloaded files
      run: ls -R
    - name: Calculate sha256
      run: |
        echo -e "\nSHA256: " >> changelog.md
        sha256sum *.nvda-addon >> changelog.md

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          *.nvda-addon
        body_path: changelog.md
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}
